# Nginx config for Printing Comics
#
# Place this at /etc/nginx/sites-available/printingcomics.conf and symlink
# into /etc/nginx/sites-enabled/.
#
# Two upstreams:
#   - React (Vite build) static files served directly
#   - Node API at http://127.0.0.1:4000 via /api/*
#
# 2GB upload support is configured via client_max_body_size.

upstream pc_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name printingcomics.com www.printingcomics.com;
    return 301 https://$host$request_uri;
}

# --- comicarmor.com -> the Shipping Supplies section --------------------------
# The standalone Comic Armor site was retired and folded into this storefront.
# Everything on the old domain lands on the section that replaced it.
#
# Before enabling: point comicarmor.com (and www) at this server's IP, then
#   certbot --nginx -d comicarmor.com -d www.comicarmor.com
# Until the cert exists, nginx will fail to reload with the 443 block below —
# comment it out (keeping the :80 block) for the initial certbot run.
server {
    listen 80;
    listen [::]:80;
    server_name comicarmor.com www.comicarmor.com;

    # Leave ACME challenges reachable so certbot can renew over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://printingcomics.com/shop/shipping-supplies; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name comicarmor.com www.comicarmor.com;

    ssl_certificate     /etc/letsencrypt/live/comicarmor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comicarmor.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 301, not 302: the old URLs are gone for good, so let search engines pass
    # their ranking to the new page instead of holding it on a dead domain.
    return 301 https://printingcomics.com/shop/shipping-supplies;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name printingcomics.com www.printingcomics.com;

    # --- TLS (managed by certbot / your cert provider) ---
    ssl_certificate     /etc/letsencrypt/live/printingcomics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/printingcomics.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- Upload size: 2GB ---
    client_max_body_size 2048m;
    client_body_buffer_size 128k;
    client_body_timeout 3600s;
    client_header_timeout 600s;
    send_timeout 3600s;

    # --- API proxy ---
    location /api/ {
        proxy_pass http://pc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Large uploads: stream through, don't buffer
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Uploaded email attachments (served via express.static).
    location /uploads/ {
        proxy_pass http://pc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1h;
    }

    # --- React SPA (Vite build output) ---
    root /var/www/printingcomics/web/dist;
    index index.html;

    # Cache static assets aggressively
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Deny sensitive dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
