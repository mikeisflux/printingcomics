<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imposition Toolkit — vanilla engine demo</title>

  <!--
    Runnable with NO build step and NO framework.
    Because it uses ES modules, serve this folder over http (not file://):
        npx serve .        # or: python3 -m http.server
    then open http://localhost:3000/examples/vanilla.html

    The import map maps the engine's dynamic import('pdf-lib') to a CDN.
  -->
  <script type="importmap">
  { "imports": { "pdf-lib": "https://esm.sh/pdf-lib@1.17.1" } }
  </script>

  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #0f172a; }
    h1 { font-size: 1.4rem; }
    fieldset { border: 1px solid #e2e8f0; border-radius: 8px; margin: 1rem 0; padding: 1rem 1.25rem; }
    label { display: inline-block; min-width: 120px; }
    input[type=number] { width: 5rem; }
    button { background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: .6rem 1.2rem; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .muted { color: #64748b; font-size: .9rem; }
    #status { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Imposition Toolkit — engine demo</h1>
  <p class="muted">
    Drop a PDF, choose a grid, and download an imposed press sheet. Everything
    runs in your browser — the file is never uploaded.
  </p>

  <fieldset>
    <legend>1. Source PDF</legend>
    <input id="file" type="file" accept="application/pdf,.pdf" />
    <div id="info" class="muted"></div>
  </fieldset>

  <fieldset>
    <legend>2. N-Up settings</legend>
    <div><label>Columns</label><input id="cols" type="number" value="3" min="1" /></div>
    <div><label>Rows</label><input id="rows" type="number" value="3" min="1" /></div>
    <div><label>Sheet W (in)</label><input id="sw" type="number" value="8.5" step="0.25" /></div>
    <div><label>Sheet H (in)</label><input id="sh" type="number" value="11" step="0.25" /></div>
    <div><label>Margin (in)</label><input id="margin" type="number" value="0.25" step="0.0625" /></div>
    <div><label>Gutter (in)</label><input id="gutter" type="number" value="0.125" step="0.0625" /></div>
    <div><label>Crop marks</label><input id="marks" type="checkbox" checked /></div>
    <div><label>Step &amp; repeat</label><input id="repeat" type="checkbox" /> <span class="muted">(page 1 in every cell)</span></div>
  </fieldset>

  <button id="go" disabled>Impose &amp; download</button>
  <div id="status"></div>

  <script type="module">
    // Adjust the path if you move this file. From examples/ the build is ../dist.
    import { getPdfInfo, imposeNUp, downloadPdf } from '../dist/impose.mjs';

    const $ = (id) => document.getElementById(id);
    let bytes = null;

    $('file').addEventListener('change', async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      bytes = new Uint8Array(await f.arrayBuffer());
      try {
        const info = await getPdfInfo(bytes);
        $('info').textContent = `${info.count} page(s) · ${info.widthIn}″ × ${info.heightIn}″`;
        $('go').disabled = false;
      } catch (err) {
        $('info').textContent = 'Could not read PDF: ' + err.message;
        $('go').disabled = true;
      }
    });

    $('go').addEventListener('click', async () => {
      if (!bytes) return;
      $('go').disabled = true;
      $('status').textContent = 'Imposing…';
      try {
        const out = await imposeNUp(bytes, {
          cols: +$('cols').value,
          rows: +$('rows').value,
          sheetWIn: +$('sw').value,
          sheetHIn: +$('sh').value,
          marginIn: +$('margin').value,
          gutterIn: +$('gutter').value,
          repeatFirst: $('repeat').checked,
          addMarks: $('marks').checked,
          markLenIn: 0.25,
          markOffIn: 0.125,
        });
        downloadPdf(out, 'imposed.pdf');
        $('status').textContent = '✓ Downloaded imposed.pdf';
      } catch (err) {
        $('status').textContent = '✗ ' + err.message;
      } finally {
        $('go').disabled = false;
      }
    });
  </script>
</body>
</html>
