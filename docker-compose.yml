services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: printingcomics
      POSTGRES_USER: printingcomics
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printingcomics -d printingcomics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
