name: Encrypted Supabase Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_DB_URL"
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Create encrypted database dump
        run: |
          pg_dump --format=custom --no-owner --no-privileges --file=philbo-staging.dump "$SUPABASE_DB_URL"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in philbo-staging.dump -out philbo-staging.dump.enc -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          rm philbo-staging.dump

      - name: Store encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: philbo-staging-db-${{ github.run_id }}
          path: philbo-staging.dump.enc
          retention-days: 30
          if-no-files-found: error

